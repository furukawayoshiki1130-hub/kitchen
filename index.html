<div id="app"><div class="boot">読み込み中…</div></div>

<style>
  #app, #app * { box-sizing: border-box; }
  #app {
    --bg:#e8edeb; --card:#fff; --ink:#12211d; --ink2:#47574f; --mute:#7d8d86;
    --line:#d3ddd9; --primary:#1b6b57; --soft:#dff0e9; --urgent:#b3431f;

  #app .item { display:flex; align-items:center; gap:8px; padding:9px 10px;

    font-size:11px; padding:4px 7px; border-radius:6px; font-family:var(--font); cursor:pointer; }

  #app input[type=text],#app input[type=number],#app input[type=date],#app select,#app textarea {
    font-family:var(--font); font-size:15px; padding:9px 10px; border:1px solid var(--line);
    border-radius:8px; background:#fff; color:var(--ink); width:100%; }
  #app .row { display:flex; gap:6px; margin-bottom:8px; }
  #app .row > * { min-width:0; }
  #app .chips { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:9px; }
  #app .chip { font-size:12px; padding:5px 9px; border-radius:14px; border:1px solid var(--line);
    background:#fff; color:var(--ink2); cursor:pointer; }
  #app .chip.sel { background:var(--primary); border-color:var(--primary); color:#fff; }
  #app .go { display:block; width:100%; padding:11px; border:none; border-radius:8px; background:var(--primary);
    color:#fff; font-size:15px; font-weight:700; font-family:var(--font); cursor:pointer; text-align:center; }
  #app .go[disabled] { opacity:.5; }
  #app .go.alt { background:#fff; color:var(--primary); border:1px solid var(--primary); }
  #app .ghost { padding:8px 12px; border:1px solid var(--primary); border-radius:8px; background:#fff;
    color:var(--primary); font-size:13px; font-weight:600; font-family:var(--font); cursor:pointer; text-align:center; }

  #app .rec { border:1px solid var(--line); border-radius:10px; margin-bottom:9px; background:#fff; overflow:hidden; }
  #app .rec.pin { border-color:var(--primary); }
  #app .rec-hd { padding:11px 12px; cursor:pointer; }
  #app .rec-line { display:flex; align-items:baseline; gap:8px; }
  #app .rec-name { font-size:15px; font-weight:700; flex:1; }
  #app .rec-pct { font-size:12px; font-weight:700; color:var(--primary); white-space:nowrap; }
  #app .rec-btn { display:inline-block; margin-top:6px; background:var(--soft); color:#14503f;
    font-size:12px; font-weight:600; padding:4px 8px; border-radius:6px; }
  #app .rec-src { font-size:11px; color:var(--mute); margin-top:5px; }
  #app .rec-rescue { font-size:11px; color:var(--urgent); font-weight:600; margin-top:5px; }
  #app .rec-lack { font-size:11px; color:var(--ink2); margin-top:4px; }
  #app .rec-body { padding:0 12px 12px; border-top:1px solid var(--line); }
  #app .rec-body h4 { font-size:12px; margin:12px 0 5px; color:var(--mute); font-weight:700; }
  #app .ing { display:flex; justify-content:space-between; gap:8px; font-size:13px; padding:3px 0; border-bottom:1px dotted var(--line); }
  #app .ing.no { color:var(--urgent); }
  #app ol.steps { margin:4px 0 0; padding-left:18px; font-size:13px; }
  #app ol.steps li { margin-bottom:4px; }
  #app .tip { font-size:12px; background:var(--warn-soft); padding:8px 10px; border-radius:6px; margin-top:10px; color:#6b511a; }
  #app .rec-acts { display:flex; gap:6px; margin-top:12px; }
  #app .rec-acts button { flex:1; }
  #app .arow { padding:7px 0; border-bottom:1px dotted var(--line); }
  #app .arow .atop { display:flex; justify-content:space-between; gap:8px; font-size:13px; }
  #app .arow .acut { font-size:11px; color:var(--mute); }
  #app .arow .actl { display:flex; gap:6px; align-items:center; justify-content:flex-end; margin-top:5px; }
  #app .arow .actl button { border:1px solid var(--line); background:#fff; color:var(--ink2);
    font-size:14px; min-width:36px; height:32px; border-radius:6px; font-family:var(--font); cursor:pointer; padding:0 8px; }
  #app .arow .aval { font-size:13px; font-weight:600; min-width:104px; text-align:center; }

  #app .shop-g { margin-bottom:12px; }
  #app .shop-g h3 { font-size:12px; color:var(--mute); margin:0 0 6px; font-weight:700; }
  #app .shop-i { display:flex; align-items:center; gap:9px; padding:8px 4px; border-bottom:1px solid var(--line); font-size:14px; }
  #app .shop-i input { width:20px; height:20px; flex:none; accent-color:var(--primary); }
  #app .shop-i .q { color:var(--ink2); font-size:12px; margin-left:auto; white-space:nowrap; }
  #app .shop-i.done { color:var(--mute); text-decoration:line-through; }
  #app .plan-i { display:flex; align-items:center; gap:8px; font-size:14px; padding:7px 0; border-bottom:1px solid var(--line); }
  #app .plan-i button { border:none; background:none; color:var(--mute); font-size:17px; cursor:pointer; }
  #app .empty { font-size:13px; color:var(--mute); padding:14px 4px; text-align:center; }
  #app .bar { height:12px; background:var(--line); border-radius:6px; overflow:hidden; margin:10px 0 8px; }
  #app .bar i { display:block; height:100%; background:var(--primary); border-radius:6px; transition:width .35s ease; }
  #app .bignum { font-size:26px; font-weight:700; line-height:1.2; }
  #app .bignum small { font-size:13px; font-weight:400; color:var(--mute); margin-left:4px; }
  #app .tl { margin-top:10px; }
  #app .tl .r { display:flex; gap:10px; font-size:13px; padding:5px 0; border-bottom:1px dotted var(--line); align-items:flex-start; }
  #app .tl .r b { flex:none; width:50px; color:var(--primary); font-weight:700; }
  #app .tl .r.eat b { color:var(--urgent); }
  #app .dayhd { display:flex; align-items:baseline; gap:8px; }
  #app .dayhd .d { font-size:16px; font-weight:700; }
  #app .res { display:inline-block; background:var(--warn-soft); color:#6b511a;
    font-size:11px; font-weight:700; padding:2px 7px; border-radius:5px; margin-left:6px; }
  #app .money { display:flex; gap:8px; align-items:center; font-size:13px; }
  #app .money input { flex:1; }
  #app .loss { font-size:13px; padding:8px 10px; background:var(--urgent-soft); border-radius:8px; color:#7a2c12; }

  #app nav { position:fixed; bottom:0; left:0; right:0; max-width:460px; margin:0 auto;
    display:flex; background:#fff; border-top:1px solid var(--line); }
  #app nav button { flex:1; padding:11px 4px 14px; border:none; background:none;
    font-family:var(--font); font-size:12px; color:var(--mute); cursor:pointer; }
  #app nav button.on { color:var(--primary); font-weight:700; box-shadow:inset 0 2px 0 var(--primary); }
  #app nav .badge { display:inline-block; background:var(--urgent); color:#fff; font-size:10px;
    border-radius:8px; padding:0 5px; margin-left:3px; }
  #app .toast { position:fixed; bottom:88px; left:50%; transform:translateX(-50%); background:var(--ink);
    color:#fff; font-size:13px; padding:9px 15px; border-radius:20px; z-index:20; max-width:90%; }
</style>

<script>
(function () {
  const KEY = 'kitchen-v2', DAY = 86400000;
  let S = { inv:[], plan:[], custom:[], serv:6, chk:{}, spend:[], loss:[], memo:{}, freq:{}, arr:{}, day:{}, hist:[], dinner:'18:30' };
  let tab='fridge', openRec=null, filter='all', showAll=false, pick=[];

  /* ================= 食材の名寄せ ================= */
  const CANON = {
    '豚肉':['豚','豚こま','豚バラ','豚ロース','豚もも','豚肩'],
    '鶏肉':['鶏','とり肉','鶏もも','鶏むね','鶏胸','ささみ','手羽'],
    '牛肉':['牛','牛こま','牛バラ','牛角切り'],
    'ひき肉':['挽き肉','挽肉','合いびき','合びき','豚ひき','鶏ひき','牛ひき'],
    '玉ねぎ':['たまねぎ','タマネギ','玉葱'], 'にんじん':['人参','ニンジン'],
    'じゃがいも':['ジャガイモ','じゃが芋','馬鈴薯','メークイン'],
    '大根':['だいこん','ダイコン'], '白菜':['はくさい'], 'キャベツ':['きゃべつ'],
    'もやし':['モヤシ'], 'トマト':['ミニトマト','カットトマト','トマト缶','トマト水煮'],
    '豆腐':['とうふ','木綿豆腐','絹豆腐','絹ごし'], '厚揚げ':['あつあげ','生揚げ'],
    '卵':['たまご','タマゴ','鶏卵'],
    'きのこ':['しめじ','えのき','しいたけ','椎茸','まいたけ','舞茸','エリンギ','マッシュルーム'],
    'ねぎ':['長ねぎ','長ネギ','青ねぎ','小ねぎ','白ねぎ'], 'ピーマン':['パプリカ'],
    'なす':['ナス','茄子'], 'ブロッコリー':[], 'ほうれん草':['ほうれんそう','小松菜'],
    'さば':['鯖','サバ'], '鮭':['さけ','サケ','サーモン'], 'ぶり':['ブリ','鰤'],
    'ごぼう':['ゴボウ','牛蒡'], 'れんこん':['レンコン','蓮根'], '里いも':['里芋','サトイモ'],
    'こんにゃく':['しらたき','糸こんにゃく'], '油揚げ':['あぶらあげ'],
    'ウインナー':['ソーセージ','ウィンナー'], 'ベーコン':[], 'セロリ':[],
    'かぼちゃ':['カボチャ','南瓜'], 'かぶ':['カブ','蕪'], 'わかめ':['ワカメ'], '米':['ごはん','お米']
  };
  const AISLE = {
    '青果':['玉ねぎ','にんじん','じゃがいも','大根','白菜','キャベツ','もやし','トマト','きのこ','ねぎ','ピーマン','なす','ブロッコリー','ほうれん草','ごぼう','れんこん','セロリ','かぼちゃ','里いも','かぶ'],
    '肉・魚':['豚肉','鶏肉','牛肉','ひき肉','さば','鮭','ぶり','ウインナー','ベーコン'],
    '豆腐・卵・練り物':['豆腐','厚揚げ','卵','油揚げ','こんにゃく'],
    'その他':['わかめ','米']
  };
  const SHELF = { '青果':6, '肉・魚':3, '豆腐・卵・練り物':8, 'その他':14 };
  function canon(raw){ const s=String(raw||'').replace(/\s|　/g,'');
    for(const k in CANON){ if(s.includes(k)) return k; for(const x of CANON[k]) if(s.includes(x)) return k; } return s; }
  function aisle(n){ const c=canon(n); for(const a in AISLE) if(AISLE[a].indexOf(c)>=0) return a; return 'その他'; }

  /* ================= 半端な量の扱い ================= */
  const UNI={'½':0.5,'¼':0.25,'¾':0.75,'⅓':1/3,'⅔':2/3};
  function parseQty(t){
    let s=String(t||'').trim().replace(/　/g,' ');
    for(const k in UNI) s=s.replace(k,' '+UNI[k]);
    s=s.trim(); let m;
    m=s.match(/^(\d+(?:\.\d+)?)\s*(?:と|\s)\s*(\d+)\s*\/\s*(\d+)$/);
    if(m) return Number(m[1])+Number(m[2])/Number(m[3]);
    m=s.match(/^(\d+)\s*\/\s*(\d+)$/);
    if(m) return Number(m[1])/Number(m[2]);
    m=s.match(/^(\d+(?:\.\d+)?)$/);
    if(m) return Number(m[1]);
    return null;
  }
  function frac(n){
    if(n===null||isNaN(n)) return '';
    const sg=n<0?'-':''; n=Math.abs(n);
    const w=Math.floor(n+1e-9), r=n-w;
    const tbl=[[0.5,'1/2'],[0.25,'1/4'],[0.75,'3/4'],[1/3,'1/3'],[2/3,'2/3']];
    for(let i=0;i<tbl.length;i++) if(Math.abs(r-tbl[i][0])<0.02) return sg+(w?w+'と'+tbl[i][1]:tbl[i][1]);
    if(r<0.02) return sg+String(w);
    return sg+String(Math.round(n*10)/10);
  }
  /* 1個・1本あたりのおおよそのg数。メニュー集の材料表にある（ ）内のg数がもと */
  const GRAM={
    '玉ねぎ':{'個':200},'じゃがいも':{'個':150},'にんじん':{'本':200},'大根':{'本':800},
    'キャベツ':{'個':1200,'玉':1200},'白菜':{'個':2000,'玉':2000},'なす':{'本':100},
    'トマト':{'個':150,'缶':400},'ピーマン':{'個':35},'かぼちゃ':{'個':1800},
    'ごぼう':{'本':200},'れんこん':{'節':200},'きのこ':{'パック':100},'ねぎ':{'本':100},
    '豆腐':{'丁':300},'厚揚げ':{'枚':150},'油揚げ':{'枚':30},'こんにゃく':{'枚':250},
    'もやし':{'袋':200},'ブロッコリー':{'株':250},'ほうれん草':{'束':200},
    '里いも':{'個':50},'セロリ':{'本':100},'かぶ':{'個':80}
  };
  function toG(name,qty,unit){
    const u=String(unit||'').trim();
    if(u==='g'||u==='ｇ') return qty;
    if(u==='kg') return qty*1000;
    const t=GRAM[canon(name)];
    return (t&&t[u]!==undefined) ? qty*t[u] : null;
  }
  function fromG(name,g,unit){
    const u=String(unit||'').trim();
    if(u==='g'||u==='ｇ') return g;
    if(u==='kg') return g/1000;
    const t=GRAM[canon(name)];
    return (t&&t[u]!==undefined) ? g/t[u] : null;
  }

  /* ================= アレンジ（具を足す） ================= */
  /* c=切り方 w=水分が多い f=崩れやすい l=加熱後に混ぜる */
  const CUT={
    'きのこ':{c:'石づきを取り小房に分ける',w:1},'ピーマン':{c:'乱切り'},
    'なす':{c:'厚さ2cmの半月切り',w:1,f:1},'キャベツ':{c:'ざく切り',w:1},
    '白菜':{c:'ざく切り',w:1},'もやし':{c:'洗ってそのまま',w:1},
    'にんじん':{c:'薄めの乱切り'},'じゃがいも':{c:'小さめの乱切り'},
    '玉ねぎ':{c:'くし切り',w:1},'大根':{c:'厚さ2cmのいちょう切り',w:1},
    'かぶ':{c:'くし切り',w:1,f:1},'ごぼう':{c:'ささがき'},
    'れんこん':{c:'薄めの乱切り'},'かぼちゃ':{c:'3cm角'},'里いも':{c:'皮をむいて半分'},
    'トマト':{c:'くし切り',w:1},'ねぎ':{c:'斜め切り',w:1},
    'ブロッコリー':{c:'小房に分ける',l:1},'ほうれん草':{c:'ざく切り',w:1,l:1},
    '豆腐':{c:'大きめの角切り',w:1,f:1},'厚揚げ':{c:'ひと口大'},
    '油揚げ':{c:'短冊切り'},'こんにゃく':{c:'手でちぎる'},
    'ウインナー':{c:'斜めに切り込みを入れる'},'ベーコン':{c:'短冊切り'},
    'セロリ':{c:'筋を取り斜め切り',w:1},'卵':{c:'とき卵にする',l:1}
  };
  const DAYS=['月','火','水','木','金','土','日'];
  const canRes = r => String(r.icons||'').indexOf('予約可')>=0;
  function parseMinutes(t){
    const s=String(t||''); let best=0, m;
    const re=/(?:(\d+)\s*時間)?\s*(\d+)\s*分/g;
    while((m=re.exec(s))){ const v=Number(m[1]||0)*60+Number(m[2]||0); if(v>best) best=v; }
    if(!best){ const h=s.match(/(\d+)\s*時間/); if(h) best=Number(h[1])*60; }
    return best||30;
  }
  function prepMin(r){ return Math.min(20, 5+3*Math.max(0,(r.main?r.main.length:1)-1)); }
  function toMin(hhmm){ const p=String(hhmm||'18:30').split(':'); return Number(p[0])*60+Number(p[1]||0); }
  function hm(v){ v=((v%1440)+1440)%1440; const h=Math.floor(v/60), m=v%60;
    return h+':'+(m<10?'0':'')+m; }
  function resNote(r){
    if(r.base==='b5'||r.id==='k5') return '予約のときは、水をさらに約150mL減らしてください。';
    if(String(r.icons||'').indexOf('無水')>=0) return '予約のときは、焦げ付き防止に水を50〜100mL加えてください。';
    return '予約のときは、水分が飛びにくいぶん味が薄まりません。そのままの分量で大丈夫です。';
  }
  /* 1台しかない前提で、夕食時刻から逆算した段取りを組む */
  function planDay(list){
    const WASH=10;
    /* 予約できるものを先に回すと、その加熱時間がまるごと夕方から消える */
    const items=list.slice().sort((a,b)=>{
      const ra=canRes(a)?0:1, rb=canRes(b)?0:1;
      if(ra!==rb) return ra-rb;
      return parseMinutes(b.min)-parseMinutes(a.min); });
    let total=prepMin(items[0]);
    for(let i=0;i<items.length;i++){
      const c=parseMinutes(items[i].min), nx=items[i+1];
      total += nx ? Math.max(c,prepMin(nx))+WASH : c;
    }
    const end=toMin(S.dinner||'18:30');
    let t=end-total;
    const rows=[];
    rows.push({t:t, x:items[0].name+'の下ごしらえ（約'+prepMin(items[0])+'分）'});
    t+=prepMin(items[0]);
    for(let i=0;i<items.length;i++){
      const r=items[i], c=parseMinutes(r.min), nx=items[i+1];
      rows.push({t:t, x:r.name+'をスタート（'+c+'分）'+(canRes(r)?'<span class="res">予約可</span>':'')});
      if(nx){
        rows.push({t:t+3, x:'加熱中に'+nx.name+'の下ごしらえ（約'+prepMin(nx)+'分）'});
        t+=Math.max(c,prepMin(nx));
        rows.push({t:t, x:'取り出して内鍋を洗う（'+WASH+'分）'});
        t+=WASH;
      } else t+=c;
    }
    rows.push({t:end, x:'いただきます', eat:1});
    /* 先に作るものが予約可なら、帰宅後は2品目だけで済む */
    let tip='';
    if(items.length>1 && canRes(items[0])){
      const need=parseMinutes(items[1].min)+WASH;
      tip=items[0].name+'は予約調理にできます。できあがり時刻を'+hm(end-need)+'に設定して朝セットしておけば、帰宅後は内鍋を洗って'+items[1].name+'を作るだけになります。';
    } else if(items.length===1 && canRes(items[0])){

  function label(pk,vk,zk){ return zk==='curry' ? P[pk].s+'カレー' : P[pk].s+'と'+V[vk].s+SZ[zk].s; }
  function build(b,pk,vk,zk){
    const p=P[pk], v=V[vk], z=SZ[zk];
    const main=[{n:p.n,q:p.q,u:p.u},{n:v.n,q:v.q,u:v.u,c:v.c}];
    b.sub.forEach(k=>main.push({n:V[k].n,q:V[k].q,u:V[k].u,c:V[k].c}));
    return { id:'g:'+b.id+':'+pk+':'+vk+':'+zk, gen:true, base:b.id, name:label(pk,vk,zk),
      nav:'メニューを選ぶ → カテゴリーで探す → '+b.nav, icons:b.icons, min:b.min,
      main, sub4:z.i4, sub6:z.i6, steps:[b.order], why:b.why, baseLabel:b.label };
  }
  const GEN=[];
  BASES.forEach(b=>b.P.forEach(pk=>b.V.forEach(vk=>b.Z.forEach(zk=>{
    if(b.icons.indexOf('まぜ技あり')>=0 && b.id!=='b3' && b.id!=='b6' &&
       (P[pk].t==='soft'||V[vk].t==='soft')) return;   /* 崩れる食材はまぜ技ありに載せない */
    GEN.push(build(b,pk,vk,zk));
  }))));
  const bookNames=BOOK.map(r=>r.name);
  const GENF=GEN.filter(r=>bookNames.indexOf(r.name)<0);

  /* ================= 保存先の切り替え ================= */
  try{
    const hd=document.head;
    if(!document.querySelector('meta[name=viewport]')){ const mv=document.createElement('meta');
      mv.name='viewport'; mv.content='width=device-width, initial-scale=1, viewport-fit=cover'; hd.appendChild(mv); }
    if(!document.querySelector('meta[name=theme-color]')){ const tc=document.createElement('meta');
      tc.name='theme-color'; tc.content='#1b6b57'; hd.appendChild(tc); }
    if(!document.querySelector('link[rel="icon"]')){
      const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">'+
        '<rect width="64" height="64" rx="14" fill="#1b6b57"/>'+
        '<rect x="18" y="13" width="28" height="38" rx="4" fill="#eaf5f0"/>'+
        '<rect x="18" y="30" width="28" height="3" fill="#1b6b57"/>'+
        '<rect x="39" y="19" width="3" height="8" rx="1.5" fill="#1b6b57"/>'+
        '<rect x="39" y="37" width="3" height="8" rx="1.5" fill="#1b6b57"/></svg>';
      const ic=document.createElement('link'); ic.rel='icon'; ic.type='image/svg+xml';
      ic.href='data:image/svg+xml,'+encodeURIComponent(svg); hd.appendChild(ic);
    }
    if(!document.title) document.title='うちの冷蔵庫とホットクック';
  }catch(e){}

  const SKEY='kitchen-family-v1';      /* 家族で共有する保存先 */
  const MKEY='kitchen-mode';           /* この端末の設定（共有しない） */
  let MODE='solo', WHO='', shareAsk=false;

  const HAS_CLOUD = !!(window.storage && typeof window.storage.get === 'function');
  const HAS_LOCAL = (function(){ try{ window.localStorage.setItem('__t','1'); window.localStorage.removeItem('__t'); return true; }catch(e){ return false; } })();
  const WHERE = HAS_CLOUD ? 'Claudeアプリ内' : HAS_LOCAL ? 'この端末のブラウザ' : '保存できません（閉じると消えます）';

  async function getRaw(key, shared){
    if(HAS_CLOUD){ try{ const r=await window.storage.get(key, !!shared); return (r&&r.value)?r.value:null; }catch(e){ return null; } }
    if(!shared && HAS_LOCAL){ try{ return window.localStorage.getItem(key); }catch(e){ return null; } }
    return null;
  }
  async function setRaw(key, v, shared){
    if(HAS_CLOUD){ await window.storage.set(key, v, !!shared); return; }
    if(!shared && HAS_LOCAL){ window.localStorage.setItem(key, v); return; }
    throw new Error('no storage');
  }
  const family = () => MODE==='family' && HAS_CLOUD;
  const readRaw  = () => getRaw(family()?SKEY:KEY, family());
  const writeRaw = v  => setRaw(family()?SKEY:KEY, v, family());

  async function loadMode(){
    const v=await getRaw(MKEY,false);
    if(v){ try{ const o=JSON.parse(v); MODE=o.mode||'solo'; WHO=o.who||''; }catch(e){} }
  }
  async function saveMode(){ try{ await setRaw(MKEY, JSON.stringify({mode:MODE, who:WHO}), false); }catch(e){} }

  async function load(){ const v=await readRaw(); if(v){ try{ S=Object.assign(S,JSON.parse(v)); }catch(e){} } }
  function stamp(){ const d=new Date();
    return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes(); }
  let st; function save(){ clearTimeout(st); st=setTimeout(async()=>{
    S.upd={t:stamp(), by:WHO||''};
    try{ await writeRaw(JSON.stringify(S)); }catch(e){ toast('保存できませんでした'); } },350); }
  async function saveNow(){ clearTimeout(st); S.upd={t:stamp(), by:WHO||''};
    try{ await writeRaw(JSON.stringify(S)); return true; }catch(e){ toast('保存できませんでした'); return false; } }
  function toast(m){ const d=document.createElement('div'); d.className='toast'; d.textContent=m;
    document.getElementById('app').appendChild(d); setTimeout(()=>d.remove(),1900); }
  const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* ================= 期限 ================= */
  const today=()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; };
  function dl(i){ return i.exp ? Math.round((new Date(i.exp+'T00:00:00')-today())/DAY) : null; }
  function dcls(d){ return d===null?'':d<=1?'d0':d<=3?'d1':''; }
  function dtxt(d){ return d===null?'':d<0?'期限切れ':d===0?'今日まで':'あと'+d+'日'; }
  const expiring=()=>S.inv.filter(i=>{ const d=dl(i); return d!==null&&d<=3; });

  /* ================= 照合 ================= */
  function stock(name){ const c=canon(name); return S.inv.find(i=>canon(i.name)===c)||null; }
  const six=()=>S.serv===6;
  function q(m){ return six() ? (m.q6!==undefined ? m.q6 : Math.round(m.q*1.5*100)/100) : m.q; }
  function fq(n,u){ const uu=String(u||'');
    if(uu==='g'||uu==='ｇ'||uu==='kg'||uu==='mL'||uu==='ml') return (Math.round(n*10)/10)+uu;
    return frac(n)+uu; }
  const all=()=>BOOK.concat(GENF,S.custom);
  function enough(m,s){                 /* 足りる=true 足りない=false 判定不能=null */
    if(s.unit===m.u) return s.qty >= q(m)-1e-9;
    const hv=toG(s.name,s.qty,s.unit), nd=toG(m.n,q(m),m.u);
    if(hv===null||nd===null) return null;
    return hv >= nd-1e-9;
  }
  function ev(r){
    let have=0, lack=[], resc=[], shrt=[];
    r.main.forEach(m=>{ const s=stock(m.n);
      if(s){ have++; const d=dl(s); if(d!==null&&d<=3) resc.push(s.name);
             if(enough(m,s)===false) shrt.push(s.name); }
      else lack.push(m.n); });
    const pct=Math.round(have/r.main.length*100);
    const am=(new Date()).getHours()<11 && canRes(r) ? 18 : 0;
    return { pct, lack, resc, shrt, score: pct + resc.length*25 - shrt.length*8 + (r.gen?0:4) + am };
  }

  /* ================= 描画 ================= */
  function render(){
    const ex=expiring(), el=document.getElementById('app');
    el.innerHTML = header(ex)+'<main>'+fridge()+cook()+shop()+'</main>'+navbar(ex.length);
    bind();
  }
  function header(ex){
    const d=new Date(), w=['日','月','火','水','木','金','土'][d.getDay()];
    let a;
    if(ex.length) a='<div class="hd-alert">🍅<div><b>'+ex.length+'品</b>が3日以内に期限を迎えます。<br>'+
      esc(ex.slice(0,4).map(i=>i.name).join('、'))+(ex.length>4?' ほか':'')+'</div></div>';
    else if(!S.inv.length) a='<div class="hd-alert">🧊<div>まず冷蔵庫の中身を入れてみましょう。まとめて貼り付けられます。</div></div>';
    else a='<div class="hd-alert">✅<div>期限が迫っている食材はありません。</div></div>';
    return '<header><div class="hd-top"><span class="hd-title">うちの冷蔵庫とホットクック</span>'+
      '<span class="hd-date">KN-HW24G ／ '+(d.getMonth()+1)+'/'+d.getDate()+'('+w+')</span></div>'+a+'</header>';
  }

  function fridge(){
    const sorted=S.inv.slice().sort((a,b)=>{ const x=dl(a),y=dl(b); if(x===null)return 1; if(y===null)return -1; return x-y; });
    const list=sorted.length ? sorted.map(i=>{ const d=dl(i), near=(d!==null&&d<=1);
      const g=toG(i.name,i.qty,i.unit), showG=(g!==null&&i.unit!=='g'&&i.unit!=='ｇ');
      return '<div class="item '+dcls(d)+'"><div class="item-main"><div class="item-name">'+esc(i.name)+'</div>'+
      '<div class="item-meta">'+esc(fq(i.qty,i.unit))+(showG?'（約'+Math.round(g)+'g）':'')+' ・ '+esc(i.loc)+'</div></div>'+
      '<div class="days">'+dtxt(d)+'</div>'+
      '<div class="item-acts">'+
      (i.qty>0.26?'<button class="mini" data-half="'+i.id+'">半分使った</button>':'')+
      (near?'<button class="mini" data-toss="'+i.id+'">捨てた</button>':'')+
      '<button class="mini" data-del="'+i.id+'">使い切った</button></div></div>'; }).join('')
      : '<div class="empty">まだ何も入っていません。</div>';

    const quick=['にんじん','玉ねぎ','じゃがいも','大根','白菜','キャベツ','もやし','豚こま切れ肉','鶏もも肉','豆腐','卵','きのこ']
      .map(n=>'<span class="chip" data-quick="'+n+'">'+n+'</span>').join('');

    const favArr=Object.keys(S.freq||{}).map(k=>({k:k,n:S.freq[k].n,q:S.freq[k].q,u:S.freq[k].u,c:S.freq[k].c}))
      .sort((a,b)=>b.c-a.c).slice(0,10);
    const fav=favArr.length
      ? '<div class="card"><h2>いつものもの<span class="n">1タップで入ります</span></h2><div class="chips" style="margin:0">'+
        favArr.map(f=>'<span class="chip" data-fav="'+esc(f.k)+'">'+esc(f.n+' '+fq(f.q,f.u))+'</span>').join('')+'</div></div>'
      : '';

    return '<section id="s-fridge" class="'+(tab==='fridge'?'on':'')+'">'+
      '<div class="card"><h2>レシートから入れる</h2>'+
      '<div class="sub">レシートの写真をClaudeに送ると、そのまま貼れる一覧が返ってきます。写真と一緒に、この一文を送ってください。</div>'+
      '<input type="text" readonly value="このレシートの食材を「名前 数量単位」の形で1行ずつ出して" style="font-size:13px">'+
      '<div class="sub" style="margin:8px 0 0">返ってきた一覧を、下の欄に貼り付けてください。金額や「×2」が混ざっていても取り除きます。</div></div>'+
      fav+
      '<div class="card"><h2>まとめて入れる</h2>'+
      '<div class="sub">Claudeの一覧を貼り付けるか、1行ずつ書いてください。「にんじん 3本」「玉ねぎ 1/2個」「豚バラ薄切り肉400g」いずれも読み取ります。期限はおおよそで自動設定されます。</div>'+
      '<textarea id="b-text" rows="4" placeholder="豚こま切れ肉 400g&#10;にんじん 3本&#10;玉ねぎ 1/2個&#10;豆腐 2丁"></textarea>'+
      '<div style="height:8px"></div><button class="go" id="b-add">まとめて冷蔵庫に入れる</button></div>'+
      '<div class="card"><h2>1品ずつ入れる</h2><div class="chips">'+quick+'</div>'+
      '<div class="row"><input type="text" id="f-name" placeholder="食材名" style="flex:2"><input type="text" id="f-qty" value="1" placeholder="1/2" style="flex:1"><input type="text" id="f-unit" placeholder="個" style="flex:1"></div>'+
      '<div class="row"><select id="f-loc"><option>冷蔵</option><option>冷凍</option><option>常温</option></select><input type="date" id="f-exp"></div>'+
      '<div class="chips"><span class="chip" data-exp="2">2日後</span><span class="chip" data-exp="4">4日後</span><span class="chip" data-exp="7">1週間後</span><span class="chip" data-exp="30">1か月後</span><span class="chip" data-exp="">期限なし</span></div>'+
      '<button class="go" id="f-add">冷蔵庫に入れる</button></div>'+
      '<div class="card"><h2>いま入っているもの<span class="n">'+S.inv.length+'品</span></h2>'+
      '<div class="sub">期限が近い順。使い切ったら「使った」、間に合わなければ「捨てた」を押してください。</div>'+list+'</div>'+
      '</section>';
  }

  function cook(){
    const planned=planSorted().map(id=>all().find(x=>x.id===id)).filter(Boolean);
    const byDay={}; planned.forEach(r=>{ const d=(S.day||{})[r.id]||'未定'; (byDay[d]=byDay[d]||[]).push(r); });
    const planBlock = planned.length
      ? DAYS.concat(['未定']).filter(d=>byDay[d]).map(d=>{
          const list=byDay[d];
          let head='<div class="card" style="border-color:var(--primary)">'+
            '<div class="dayhd"><span class="d">'+esc(d==='未定'?'曜日が未定':d+'曜日')+'</span>'+
            '<span class="n" style="color:var(--mute);font-size:12px">'+list.length+'品</span></div>';
          if(d!=='未定'){
            const sc=planDay(list);
            head+='<div class="tl">'+sc.rows.map(x=>'<div class="r'+(x.eat?' eat':'')+'"><b>'+hm(x.t)+'</b><span>'+x.x+'</span></div>').join('')+'</div>'+
              '<div class="sub" style="margin:8px 0 0">ホットクック1台で直列に動かした場合の目安です。'+hm(sc.start)+'に手をつければ'+esc(S.dinner||'18:30')+'に間に合います。</div>'+
              (sc.tip?'<div class="tip" style="margin-top:8px">'+esc(sc.tip)+'</div>':'');
          } else head+='<div class="sub" style="margin:6px 0 0">曜日を決めると、夕食時刻から逆算した段取りが出ます。</div>';
          head+='</div>';
          return head+list.map(r=>card(r,ev(r))).join('');
        }).join('')
      : '';

    let ranked=all().map(r=>({r,e:ev(r)}))
      .filter(x=>S.plan.indexOf(x.r.id)<0)
      .filter(x=> filter==='all' ? true : filter==='book' ? (!x.r.gen && x.r.id.charAt(0)==='k')
                : filter==='mine' ? x.r.id.charAt(0)==='c'
                : filter==='res' ? canRes(x.r) : x.r.base===filter)
      .sort((a,b)=>b.e.score-a.e.score);

    let partial=false;
    if(pick.length){
      const hit=(r,c)=>r.main.some(m=>canon(m.n)===c);
      const strict=ranked.filter(x=>pick.every(c=>hit(x.r,c)));
      if(strict.length) ranked=strict;
      else { ranked=ranked.filter(x=>pick.some(c=>hit(x.r,c)))
               .sort((a,b)=>pick.filter(c=>hit(b.r,c)).length-pick.filter(c=>hit(a.r,c)).length); partial=true; }
    }

    const cut = showAll ? ranked.slice(0,150) : ranked.slice(0,14);
    const body = !S.inv.length
      ? '<div class="empty">冷蔵庫に食材を入れると、作れる順に並びます。</div>'
      : (!ranked.length
        ? '<div class="empty">選んだ食材をすべて使うレシピがありません。<br>どれかを外してみてください。</div>'
        : (partial?'<div class="sub" style="padding:0 2px 6px">全部は使い切れないので、多く使えるものから並べています。</div>':'')+
          cut.map(x=>card(x.r,x.e)).join('') +
          (ranked.length>cut.length ? '<button class="ghost" id="more" style="width:100%">残り'+(ranked.length-cut.length)+'件を表示</button>' : ''));

    /* 使い切りメーター */
    const uset=usedSet(), tot=S.inv.length, done=Object.keys(uset).length;
    const exl=expiring(), exDone=exl.filter(i=>uset[i.id]).length;
    const pctBar = tot? Math.round(done/tot*100) : 0;
    const meter = tot ? '<div class="card"><h2>冷蔵庫の片づき具合</h2>'+
      '<div class="bignum">'+done+'<small>／'+tot+'品が今週の献立で片づきます</small></div>'+
      '<div class="bar"><i style="width:'+pctBar+'%"></i></div>'+
      '<div class="sub" style="margin:0">'+
      (exl.length? '期限が近い'+exl.length+'品のうち'+exDone+'品を使い切る予定です。'
                 : '期限が迫っているものはありません。')+
      (done<tot? ' 残り'+(tot-done)+'品は、下から選んで献立に足せます。' : ' 今ある分は全部使い切れます。')+
      '</div></div>' : '';

    /* 冷蔵庫から食材を選んで絞る */
    const seen={}, invChips=S.inv.slice().sort((x,y)=>{ const a=dl(x),b=dl(y);
        if(a===null)return 1; if(b===null)return -1; return a-b; })
      .filter(i=>{ const c=canon(i.name); if(seen[c])return false; seen[c]=1; return true; })
      .map(i=>{ const c=canon(i.name), on=pick.indexOf(c)>=0, d=dl(i);
        return '<span class="chip '+(on?'sel':'')+'" data-pick="'+esc(c)+'">'+esc(i.name)+
        (d!==null&&d<=3&&!on?'<span style="color:var(--urgent)">　急</span>':'')+'</span>'; }).join('');
    const pickBlock = S.inv.length
      ? '<div class="sub">使い切りたいものをタップすると、それを使うレシピだけになります。</div>'+
        '<div class="chips">'+invChips+(pick.length?'<span class="chip" data-pick="__clear">選択を解除</span>':'')+'</div>'+
        (pick.length?'<div class="sub" style="margin:-4px 0 10px;color:var(--ink2)"><b>'+esc(pick.join('・'))+'</b> を使うレシピ '+ranked.length+'品</div>':'')
      : '';

    const hist=(S.hist||[]).slice(-12).reverse();
    const histBlock = hist.length
      ? '<div class="card"><h2>最近作ったもの</h2><div class="sub">タップすると今週の献立に戻せます。</div>'+
        '<div class="chips" style="margin:0">'+hist.map(h=>'<span class="chip" data-again="'+esc(h.id)+'">'+
        esc(h.n)+'<span style="color:var(--mute)">　'+esc(h.d.slice(5).replace('-','/'))+'</span></span>').join('')+'</div></div>'
      : '';

    const chips='<div class="chips"><span class="chip '+(filter==='all'?'sel':'')+'" data-f="all">すべて</span>'+
      '<span class="chip '+(filter==='book'?'sel':'')+'" data-f="book">メニュー集どおり</span>'+
      '<span class="chip '+(filter==='res'?'sel':'')+'" data-f="res">予約できる</span>'+
      (S.custom.length?'<span class="chip '+(filter==='mine'?'sel':'')+'" data-f="mine">わが家</span>':'')+
      BASES.map(b=>'<span class="chip '+(filter===b.id?'sel':'')+'" data-f="'+b.id+'">'+b.short+'</span>').join('')+'</div>';

    return '<section id="s-cook" class="'+(tab==='cook'?'on':'')+'">'+
      meter+planBlock+
      '<div class="card"><h2>作る条件</h2>'+
      '<div class="chips"><span class="chip '+(!six()?'sel':'')+'" data-serv="4">4人分</span><span class="chip '+(six()?'sel':'')+'" data-serv="6">6人分</span></div>'+
      '<div class="row" style="align-items:center"><span style="font-size:13px;flex:none">夕食の時刻</span>'+
      '<input type="time" id="c-dinner" value="'+esc(S.dinner||'18:30')+'" style="flex:0 0 130px"></div>'+
      '<div class="sub" style="margin:0">自動メニューは2〜6人分まで。5人家族なら6人分で作って、余りを翌日の汁物や弁当に回すと無駄が出ません。</div></div>'+
      '<div class="card"><h2>献立をさがす</h2>'+pickBlock+chips+
      '<div class="sub" style="margin:0">「メニュー集どおり」以外は、同じボタンで作れる応用です。全'+(GENF.length+BOOK.length)+'品。</div></div>'+
      body+histBlock+customForm()+'</section>';
  }

  function card(r,e){
    const open=(openRec===r.id), inPlan=(S.plan.indexOf(r.id)>=0);
    let h='<div class="rec-hd" data-open="'+r.id+'"><div class="rec-line"><span class="rec-name">'+esc(r.name)+'</span>'+
      '<span class="rec-pct">'+e.pct+'%</span></div>'+
      '<div class="rec-btn">'+esc((r.no?'No.'+r.no+'　':'')+(r.gen?r.baseLabel:r.name))+' ／ '+esc(r.min)+'</div>'+
      (canRes(r)?'<span class="res">予約できる</span>':'')+
      '<div class="rec-src">'+((S.day||{})[r.id]?'<b style="color:var(--primary)">'+esc(S.day[r.id])+'曜日</b>　':'')+
      esc(r.gen?'応用：'+r.baseLabel+'のボタンで作れます':(r.src||'わが家のレシピ'))+'</div>';
    if(e.resc.length) h+='<div class="rec-rescue">期限が近い '+esc(e.resc.join('・'))+' を使い切れます</div>';
    if(e.lack.length) h+='<div class="rec-lack">足りない：'+esc(e.lack.join('、'))+'</div>';
    if(e.shrt&&e.shrt.length) h+='<div class="rec-lack">量が少し足りない：'+esc(e.shrt.join('、'))+'</div>';
    h+='</div>';
    if(!open) return '<div class="rec'+(inPlan?' pin':'')+'">'+h+'</div>';

    const amap=normArr(r.id);
    const picked=Object.keys(amap).map(id=>{ const it=S.inv.find(i=>i.id===id);
      return it?{it:it,n:Math.min(amap[id],it.qty)}:null; }).filter(Boolean);
    const inRec=n=>r.main.some(m=>canon(m.n)===canon(n));
    const cand=S.inv.filter(i=>!inRec(i.name)).sort((x,y)=>{ const p=dl(x),qq=dl(y);
      if(p===null)return 1; if(qq===null)return -1; return p-qq; });
    const pickChips=cand.map(i=>{ const on=amap[i.id]!==undefined;
      return '<span class="chip '+(on?'sel':'')+'" data-arr="'+r.id+'|'+i.id+'">'+esc(i.name)+'</span>'; }).join('');

    const bk=bulk(r), baseG=bk.base, capG=bk.cap;
    let addG=0; picked.forEach(p=>{ const g=toG(p.it.name,p.n,p.it.unit); if(g!==null) addG+=g; });
    const ratio = baseG>0 ? (baseG+addG)/baseG : 1;

    const addRows=picked.map(p=>{ const c=cutOf(p.it.name), g=toG(p.it.name,p.n,p.it.unit);
      const full=Math.abs(p.n-p.it.qty)<0.005;
      return '<div class="arow"><div class="atop"><span>'+esc(p.it.name)+
      '<br><span class="acut">'+esc(c.c)+'　／　冷蔵庫に '+esc(fq(p.it.qty,p.it.unit))+'</span></span></div>'+
      '<div class="actl"><button data-adj="'+r.id+'|'+p.it.id+'|-1">−</button>'+
      '<span class="aval">'+esc(fq(p.n,p.it.unit))+(g!==null?'<br><span class="acut">約'+Math.round(g)+'g</span>':'')+'</span>'+
      '<button data-adj="'+r.id+'|'+p.it.id+'|1"'+(full?' disabled style="opacity:.4"':'')+'>＋</button>'+
      '<button data-adj="'+r.id+'|'+p.it.id+'|all">全部</button>'+
      '<button data-adj="'+r.id+'|'+p.it.id+'|x">×</button></div></div>'; }).join('');

    const notes=[];
    if(picked.length){
      const wet=picked.filter(p=>cutOf(p.it.name).w).length;
      const fra=picked.filter(p=>cutOf(p.it.name).f).length;
      const late=picked.filter(p=>cutOf(p.it.name).l);
      const room=Math.round(capG-baseG-addG);
      if(capG>0 && baseG+addG>capG*1.02)
        notes.push('入れすぎです。このボタンの上限（6人分ぶん）を約'+Math.abs(room)+'gオーバーしています。'+(six()?'4人分に切り替えるか、':'')+'−を押して減らしてください。');
      else if(capG>0 && room>0)
        notes.push('あと約'+room+'gまで足せます。');
      if(ratio>1.02) notes.push('具が'+Math.round((ratio-1)*100)+'%増えたので、上の調味料はその分だけ増やしてあります。');
      if(fra && r.icons.indexOf('まぜ技あり')>=0)
        notes.push('なす・豆腐・かぶは形が崩れます。大きめに切るか、まぜ技ユニットを外して同じ時間で作ってください。');
      if(r.icons.indexOf('無水')>=0){
        if(wet) notes.push('水は足さないでください。水っぽく仕上がったら「手動で作る → 煮詰める」で調整します。');
        else notes.push('水分の少ない野菜が増えたので、焦げ付き防止に水を50mL足してください。');
      }
      if(late.length) notes.push(late.map(p=>p.it.name).join('・')+'は加熱が終わってから混ぜてください。');
    }

    const ings=r.main.map(m=>{ const s=stock(m.n), ok=s?enough(m,s):null;
      return '<div class="ing '+(s?'':'no')+'"><span>'+esc(m.n)+(m.c?'<br><span style="font-size:11px;color:var(--mute)">'+esc(m.c)+'</span>':'')+'</span>'+
      '<span style="white-space:nowrap">'+esc(fq(q(m),m.u))+' '+(s?(ok===false?'△ 量不足':'✓'):'× 買う')+'</span></div>'; }).join('');
    const sarr=(six()&&r.sub6)?r.sub6:(r.sub4||[]);
    const subs=sarr.map(s=>'<div class="ing"><span>'+esc(scaleSeason(s,ratio))+'</span></div>').join('');
    const steps=(r.steps||[]).map(s=>'<li>'+esc(s)+'</li>').join('');
    const memo=S.memo[r.id]||'';

    const dayRow = inPlan ? '<h4>いつ作る</h4><div class="chips">'+
      DAYS.map(d=>'<span class="chip '+(((S.day||{})[r.id]===d)?'sel':'')+'" data-day="'+r.id+'|'+d+'">'+d+'</span>').join('')+
      '<span class="chip '+(!(S.day||{})[r.id]?'sel':'')+'" data-day="'+r.id+'|">未定</span></div>' : '';

    const b='<div class="rec-body">'+dayRow+
      '<h4>材料（'+S.serv+'人分）</h4>'+ings+
      (addRows?'<h4>足す分</h4>'+addRows:'')+
      (subs?'<h4>調味料'+(ratio>1.02?'（'+(Math.round(ratio*10)/10)+'倍に調整済み）':'')+'</h4>'+subs:'')+
      '<h4>冷蔵庫のものを足す</h4>'+
      (cand.length?'<div class="chips">'+pickChips+'</div>':'<div class="sub" style="margin:0">足せるものが冷蔵庫にありません。</div>')+
      (notes.length?'<div class="tip">'+notes.map(esc).join('<br><br>')+'</div>':'')+
      (steps?'<h4>作り方</h4><ol class="steps">'+steps+'</ol>':'')+
      (canRes(r)?'<h4>予約で作る</h4><div style="font-size:13px">朝セットして、できあがり時刻を'+esc(S.dinner||'18:30')+'に設定すれば帰宅時に完成します。<br>'+
        '<span style="color:var(--mute)">'+esc(resNote(r))+'</span></div>':'')+
      '<h4>ホットクックの操作</h4><div style="font-size:13px">'+esc(r.nav)+'<br>'+
      '<span style="color:var(--mute)">'+esc(r.icons)+' ／ '+esc(r.min)+(r.cap?' ／ '+esc(r.cap):'')+'</span></div>'+
      '<div class="row" style="margin-top:8px"><input type="text" data-memo="'+r.id+'" value="'+esc(memo)+'" placeholder="本体で確認したメニュー番号をメモ"></div>'+
      (r.tip?'<div class="tip">'+esc(r.tip)+'</div>':(r.why?'<div class="tip">'+esc(r.why)+'</div>':''))+
      '<div class="rec-acts"><button class="ghost" data-plan="'+r.id+'">'+(inPlan?'今週の献立から外す':'今週の献立に入れる')+'</button>'+
      '<button class="ghost" data-made="'+r.id+'">作った（在庫を減らす）</button></div></div>';
    return '<div class="rec'+(inPlan?' pin':'')+'">'+h+b+'</div>';
  }

  function need(){
    const acc={};
    S.plan.forEach(id=>{ const r=all().find(x=>x.id===id); if(!r) return;
      r.main.forEach(m=>{ const c=canon(m.n); if(!acc[c]) acc[c]={name:m.n,q:0,u:m.u}; acc[c].q+=q(m); }); });
    const out=[];
    for(const c in acc){ const n=acc[c], s=stock(n.name); let short=n.q, note='', vague=false;
      if(s){ if(s.unit===n.u){ short=n.q-s.qty; note='在庫 '+fq(s.qty,s.unit); }
             else { short=0; vague=true; note='在庫 '+fq(s.qty,s.unit)+'（量は要確認）'; } }
      if(short>0.001||vague) out.push({key:c,name:n.name,q:Math.round(short*100)/100,u:n.u,note,aisle:aisle(n.name),vague}); }
    return out;
  }

  function addItem(name,qty,unit,loc,exp){
    S.inv.push({ id:'i'+Date.now()+Math.random().toString(36).slice(2,5), name, qty, unit, loc, exp });
    const k=canon(name)+'|'+unit;
    S.freq=S.freq||{};
    S.freq[k]=S.freq[k]||{n:name,q:qty,u:unit,c:0};
    S.freq[k].c++; S.freq[k].q=qty; S.freq[k].n=name;
  }
  function defExp(name){ const d=new Date(); d.setDate(d.getDate()+(SHELF[aisle(name)]||7)); return d.toISOString().slice(0,10); }

  const UNITS='g|kg|mL|ml|個|本|袋|パック|丁|枚|切れ|玉|株|束|缶|節|房|尾';
  const SKIP=/合計|小計|税|釣|点数|ポイント|値引|割引|レジ袋|お預|クレジット|現金|支払|買上|領収|レシート|店|TEL/;
  function parseLine(l){
    let t=String(l||'').replace(/[０-９．／]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).trim();
    t=t.replace(/^[-–—・*＊>＞]+\s*/,'');
    if(!t||SKIP.test(t)) return null;
    t=t.replace(/[¥￥]\s*[\d,]+/g,'').replace(/[\d,]+\s*円/g,'').trim();
    if(!t) return null;
    let qty=null, unit=null, m;
    m=t.match(/[×xX＊*]\s*(\d+(?:\.\d+)?)\s*$/);
    if(m){ qty=Number(m[1]); unit='個'; t=t.slice(0,m.index).trim(); }
    if(qty===null){
      m=t.match(/^(.+?)[\s　]+(\d+(?:\.\d+)?(?:\s*と\s*\d+\s*\/\s*\d+|\s*\/\s*\d+)?)\s*(.*)$/);
      if(m){ const v=parseQty(m[2]); if(v!==null){ t=m[1].trim(); qty=v; unit=(m[3]||'').trim(); } }
    }
    if(qty===null){
      m=t.match(new RegExp('^(.+?)(\\d+(?:\\.\\d+)?)\\s*('+UNITS+')$'));
      if(m){ t=m[1].trim(); qty=Number(m[2]); unit=m[3]; }
    }
    t=t.replace(/[\s　]+$/,'');
    if(!t) return null;
    if(qty===null) qty=1;
    if(!unit) unit='個';
    return { name:t, qty:qty, unit:unit };
  }

  function bindAll(){
    const a=document.getElementById('app');
    a.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; render(); window.scrollTo(0,0); });
    a.querySelectorAll('[data-quick]').forEach(c=>c.onclick=()=>{ a.querySelector('#f-name').value=c.dataset.quick; });
    a.querySelectorAll('[data-f]').forEach(c=>c.onclick=()=>{ filter=c.dataset.f; showAll=false; openRec=null; render(); });
    a.querySelectorAll('[data-serv]').forEach(c=>c.onclick=()=>{ S.serv=Number(c.dataset.serv); save(); render(); });
    const more=a.querySelector('#more'); if(more) more.onclick=()=>{ showAll=true; render(); };
    const dn=a.querySelector('#c-dinner');
    if(dn) dn.onchange=()=>{ S.dinner=dn.value||'18:30'; save(); render(); };

    a.querySelectorAll('[data-exp]').forEach(c=>c.onclick=()=>{ const v=c.dataset.exp, f=a.querySelector('#f-exp');
      if(v===''){ f.value=''; return; }
      const d=new Date(); d.setDate(d.getDate()+Number(v)); f.value=d.toISOString().slice(0,10);
      a.querySelectorAll('[data-exp]').forEach(o=>o.classList.remove('sel')); c.classList.add('sel'); });

    const ba=a.querySelector('#b-add');
    if(ba) ba.onclick=()=>{ const raw=a.querySelector('#b-text').value.trim();
      if(!raw){ toast('入れるものを書いてください'); return; }
      let c=0;
      let skipped=0;
      raw.split('\n').forEach(l=>{ const it=parseLine(l);
        if(!it){ if(l.trim()) skipped++; return; }
        addItem(it.name,it.qty,it.unit,'冷蔵',defExp(it.name)); c++; });
      save(); render();
      toast(c+'品を入れました'+(skipped?'（'+skipped+'行は金額などとして除きました）':'')); };

    const fa=a.querySelector('#f-add');
    if(fa) fa.onclick=()=>{ const n=a.querySelector('#f-name').value.trim();
      if(!n){ toast('食材名を入れてください'); return; }
      addItem(n, Number(a.querySelector('#f-qty').value)||1, a.querySelector('#f-unit').value.trim()||'個',
        a.querySelector('#f-loc').value, a.querySelector('#f-exp').value||null);
      save(); render(); toast(n+' を入れました'); };

    a.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ S.inv=S.inv.filter(i=>i.id!==b.dataset.del); save(); render(); });
    a.querySelectorAll('[data-toss]').forEach(b=>b.onclick=()=>{
      const it=S.inv.find(i=>i.id===b.dataset.toss); if(!it) return;
      S.loss=(S.loss||[]).concat([{d:new Date().toISOString().slice(0,10),n:it.name}]);
      S.inv=S.inv.filter(i=>i.id!==it.id); save(); render(); toast('記録しました'); });

    a.querySelectorAll('[data-open]').forEach(h=>h.onclick=()=>{ openRec=(openRec===h.dataset.open?null:h.dataset.open); render(); });
    a.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{ const id=b.dataset.plan, i=S.plan.indexOf(id);
      if(i>=0) S.plan.splice(i,1); else S.plan.push(id); save(); render(); });
    a.querySelectorAll('[data-unplan]').forEach(b=>b.onclick=()=>{ S.plan=S.plan.filter(x=>x!==b.dataset.unplan); save(); render(); });

    a.querySelectorAll('[data-made]').forEach(b=>b.onclick=()=>{ const r=all().find(x=>x.id===b.dataset.made); if(!r) return;
      const used=[];
      r.main.forEach(m=>{ const s=stock(m.n); if(!s) return; used.push(s.name);
        let left=null;
        if(s.unit===m.u) left=s.qty-q(m);
        else { const hv=toG(s.name,s.qty,s.unit), nd=toG(m.n,q(m),m.u);
               if(hv!==null&&nd!==null){ const g=hv-nd; left = g>0 ? fromG(s.name,g,s.unit) : 0; } }
        if(left===null){ S.inv=S.inv.filter(x=>x.id!==s.id); return; }
        s.qty=Math.round(left*100)/100;
        if(s.qty<=0.01) S.inv=S.inv.filter(x=>x.id!==s.id); });
      const am=normArr(r.id);
      Object.keys(am).forEach(id=>{ const s=S.inv.find(x=>x.id===id); if(!s) return;
        used.push(s.name);
        s.qty=Math.round((s.qty-Math.min(am[id],s.qty))*100)/100;
        if(s.qty<=0.01) S.inv=S.inv.filter(x=>x.id!==id); });
      if(S.arr) delete S.arr[r.id];
      S.hist=(S.hist||[]).concat([{d:new Date().toISOString().slice(0,10),n:r.name,id:r.id}]).slice(-40);
      S.plan=S.plan.filter(x=>x!==r.id);
      if(S.day) delete S.day[r.id];
      save(); render();
      toast(used.length?used.join('・')+' を減らしました':'在庫に該当なし'); });

    a.querySelectorAll('[data-memo]').forEach(inp=>inp.onchange=()=>{ S.memo[inp.dataset.memo]=inp.value.trim(); save(); });
    a.querySelectorAll('[data-chk]').forEach(c=>c.onchange=()=>{ S.chk[c.dataset.chk]=c.checked; save(); render(); });

    const ps=a.querySelector('#p-stock');
    if(ps) ps.onclick=()=>{ const its=need().filter(i=>S.chk[i.key]);
      if(!its.length){ toast('チェックがありません'); return; }
      its.forEach(i=>{ const s=stock(i.name);
        if(s&&s.unit===i.u){ s.qty+=i.q; s.exp=defExp(i.name); }
        else addItem(i.name,i.q||1,i.u,'冷蔵',defExp(i.name));
        delete S.chk[i.key]; });
      save(); render(); toast(its.length+'品を冷蔵庫に入れました'); };

    const xa=a.querySelector('#x-add');
    if(xa) xa.onclick=()=>{ const n=a.querySelector('#x-name').value.trim(), raw=a.querySelector('#x-ing').value.trim();
      if(!n||!raw){ toast('料理名と材料を入れてください'); return; }
      const bid=a.querySelector('#x-base').value, b=ALLBASE().find(x=>x.id===bid);
      if(!b){ toast('作りかたを選んでください'); return; }
      const mn=a.querySelector('#x-min').value.trim();
      const main=raw.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
        const m=l.match(/^(.+?)[\s　]+([0-9.]+)(.*)$/);
        return m?{n:m[1],q:Number(m[2]),u:(m[3]||'').trim()}:{n:l,q:1,u:''}; });
      S.custom.push({ id:'c'+Date.now(), name:n, base:bid, baseLabel:b.label, gen:false,
        nav:(bid.charAt(0)==='m' ? b.nav : 'メニューを選ぶ → カテゴリーで探す → '+b.nav),
        icons:b.icons, min:(mn? (/[分時℃]/.test(mn)?mn:'約'+mn+'分') : b.min),
        main, sub4:[], steps:[b.order], src:'わが家のレシピ' });
      save(); render(); toast(n+' を保存しました'); };

    a.querySelectorAll('[data-pick]').forEach(c=>c.onclick=()=>{
      const v=c.dataset.pick;
      if(v==='__clear') pick=[];
      else { const k=pick.indexOf(v); if(k>=0) pick.splice(k,1); else pick.push(v); }
      showAll=false; openRec=null; render(); });

    a.querySelectorAll('[data-day]').forEach(c=>c.onclick=()=>{
      const p=c.dataset.day.split('|'); S.day=S.day||{};
      if(p[1]) S.day[p[0]]=p[1]; else delete S.day[p[0]];
      save(); render(); });

    a.querySelectorAll('[data-again]').forEach(c=>c.onclick=()=>{
      const id=c.dataset.again;
      if(!all().find(x=>x.id===id)){ toast('このレシピは見つかりません'); return; }
      if(S.plan.indexOf(id)<0) S.plan.push(id);
      openRec=id; save(); render(); window.scrollTo(0,0); });

    a.querySelectorAll('[data-arr]').forEach(c=>c.onclick=()=>{
      const p=c.dataset.arr.split('|'), rid=p[0], iid=p[1];
      const r=all().find(x=>x.id===rid), it=S.inv.find(i=>i.id===iid);
      if(!r||!it) return;
      const map=normArr(rid);
      if(map[iid]!==undefined){ delete map[iid]; save(); render(); return; }
      const bk=bulk(r), room=bk.cap-bk.base-addedG(r,map);
      const st=stepOf(it.unit), g=toG(it.name,it.qty,it.unit);
      let def=it.qty;                                  /* 初期値は入る範囲で最大 */
      if(g!==null && room>0 && g>room){
        const conv=fromG(it.name,room,it.unit);
        if(conv!==null) def=Math.max(st,Math.floor(conv/st)*st);
      } else if(g!==null && room<=0) def=st;
      map[iid]=Math.min(Math.round(def*100)/100,it.qty);
      save(); render(); });

    a.querySelectorAll('[data-adj]').forEach(b=>b.onclick=()=>{
      const p=b.dataset.adj.split('|'), rid=p[0], iid=p[1], op=p[2];
      const it=S.inv.find(i=>i.id===iid); if(!it) return;
      const map=normArr(rid), st=stepOf(it.unit);
      if(op==='x'){ delete map[iid]; }
      else if(op==='all'){ map[iid]=it.qty; }
      else {
        let v=(map[iid]||0)+(op==='1'?st:-st);
        v=Math.round(v*100)/100;
        if(v<st-0.001){ delete map[iid]; } else map[iid]=Math.min(v,it.qty);
      }
      save(); render(); });

    a.querySelectorAll('[data-fav]').forEach(c=>c.onclick=()=>{
      const f=(S.freq||{})[c.dataset.fav]; if(!f) return;
      addItem(f.n,f.q,f.u,'冷蔵',defExp(f.n)); save(); render(); toast(f.n+' を入れました'); });

    a.querySelectorAll('[data-half]').forEach(b=>b.onclick=()=>{
      const it=S.inv.find(i=>i.id===b.dataset.half); if(!it) return;
      it.qty=Math.round(it.qty/2*100)/100;
      if(it.qty<=0.01) S.inv=S.inv.filter(i=>i.id!==it.id);
      save(); render(); });

    const whoIn=a.querySelector('#who');
    if(whoIn) whoIn.onchange=()=>{ WHO=whoIn.value.trim(); saveMode(); toast('名前を保存しました'); };

    const shOn=a.querySelector('#sh-on');
    if(shOn) shOn.onclick=async()=>{
      const cur=await getRaw(SKEY,true);
      if(cur){ shareAsk=true; render(); return; }
      MODE='family'; await saveMode(); await saveNow(); shareAsk=false; render();
      toast('共有をはじめました'); };

    const shTake=a.querySelector('#sh-take');
    if(shTake) shTake.onclick=async()=>{
      MODE='family'; await saveMode(); await load(); shareAsk=false; render();
      toast('共有の内容を読み込みました'); };

    const shPush=a.querySelector('#sh-push');
    if(shPush) shPush.onclick=async()=>{
      MODE='family'; await saveMode(); await saveNow(); shareAsk=false; render();
      toast('この端末の内容で共有しました'); };

    const shOff=a.querySelector('#sh-off');
    if(shOff) shOff.onclick=async()=>{
      MODE='solo'; await saveMode(); await saveNow(); render();
      toast('この端末だけの保存に戻しました'); };

    const shRe=a.querySelector('#sh-reload');
    if(shRe) shRe.onclick=async()=>{ await load(); render(); toast('最新を読み込みました'); };

    const o1=a.querySelector('#io-out');
    if(o1) o1.onclick=()=>{ const t=a.querySelector('#io'); t.value=JSON.stringify(S); t.select(); toast('コピーして保管してください'); };
    const o2=a.querySelector('#io-in');
    if(o2) o2.onclick=()=>{ const t=a.querySelector('#io').value.trim();
      if(!t){ toast('貼り付けてください'); return; }
      try{ S=Object.assign(S,JSON.parse(t)); save(); render(); toast('読み込みました'); }
      catch(e){ toast('読み込めませんでした'); } };

    const ma=a.querySelector('#m-add');
    if(ma) ma.onclick=()=>{ const v=Number(a.querySelector('#m-val').value);
      if(!v){ toast('金額を入れてください'); return; }
      S.spend=(S.spend||[]).concat([{d:new Date().toISOString().slice(0,10),v}]); save(); render(); toast('記録しました'); };
  }

  document.addEventListener('visibilitychange', async function(){
    if(document.visibilityState==='visible' && family()){ await load(); render(); }
  });

  loadMode().then(load).then(render);
})();
</script>

</body>
</html>
