  /* ================= 応用レシピの生成 ================= */
  function label(pk,vk,zk){ return zk==='curry' ? P[pk].s+'カレー' : P[pk].s+'と'+V[vk].s+SZ[zk].s; }
  function build(b,pk,vk,zk){
    const p=P[pk], v=V[vk], z=SZ[zk];
    const main=[{n:p.n,q:p.q,u:p.u},{n:v.n,q:v.q,u:v.u,c:v.c}];
    b.sub.forEach(k=>main.push({n:V[k].n,q:V[k].q,u:V[k].u,c:V[k].c}));
    return { id:'g:'+b.id+':'+pk+':'+vk+':'+zk, gen:true, base:b.id, name:label(pk,vk,zk),
      nav:'メニューを選ぶ → カテゴリーで探す → '+b.nav, icons:b.icons, min:b.min,
      main, sub4:z.i4, sub6:z.i6, steps:[b.order], why:b.why, baseLabel:b.label };
  }
  const GEN=[];
  BASES.forEach(b=>b.P.forEach(pk=>b.V.forEach(vk=>b.Z.forEach(zk=>{
    if(b.icons.indexOf('まぜ技あり')>=0 && b.id!=='b3' && b.id!=='b6' &&
       (P[pk].t==='soft'||V[vk].t==='soft')) return;   /* 崩れる食材はまぜ技ありに載せない */
    GEN.push(build(b,pk,vk,zk));
  }))));
  const bookNames=BOOK.map(r=>r.name);
  const GENF=GEN.filter(r=>bookNames.indexOf(r.name)<0);

  /* ================= 保存先の切り替え ================= */
  try{

  const HAS_CLOUD = !!(window.storage && typeof window.storage.get === 'function');
  const HAS_LOCAL = (function(){ try{ window.localStorage.setItem('__t','1'); window.localStorage.removeItem('__t'); return true; }catch(e){ return false; } })();
  const WHERE = HAS_CLOUD ? 'Claudeアプリ内' : HAS_LOCAL ? 'この端末のブラウザ' : '保存できません（閉じると消えます）';
  async function readRaw(){
    if(HAS_CLOUD){ try{ const r=await window.storage.get(KEY,false); return (r&&r.value)?r.value:null; }catch(e){ return null; } }
    if(HAS_LOCAL){ try{ return window.localStorage.getItem(KEY); }catch(e){ return null; } }
    return null;
  }
  async function writeRaw(v){
    if(HAS_CLOUD){ await window.storage.set(KEY,v,false); return; }
    if(HAS_LOCAL){ window.localStorage.setItem(KEY,v); return; }
    throw new Error('no storage');
  }
  async function load(){ const v=await readRaw(); if(v){ try{ S=Object.assign(S,JSON.parse(v)); }catch(e){} } }
  let st; function save(){ clearTimeout(st); st=setTimeout(async()=>{ try{ await writeRaw(JSON.stringify(S)); }catch(e){ toast('保存できませんでした'); } },350); }
  function toast(m){ const d=document.createElement('div'); d.className='toast'; d.textContent=m;
    document.getElementById('app').appendChild(d); setTimeout(()=>d.remove(),1900); }
  const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* ================= 期限 ================= */
  const today=()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; };
  function dl(i){ return i.exp ? Math.round((new Date(i.exp+'T00:00:00')-today())/DAY) : null; }
  function dcls(d){ return d===null?'':d<=1?'d0':d<=3?'d1':''; }
  function dtxt(d){ return d===null?'':d<0?'期限切れ':d===0?'今日まで':'あと'+d+'日'; }
  const expiring=()=>S.inv.filter(i=>{ const d=dl(i); return d!==null&&d<=3; });

  /* ================= 照合 ================= */
  function stock(name){ const c=canon(name); return S.inv.find(i=>canon(i.name)===c)||null; }
  const six=()=>S.serv===6;
  function q(m){ return six() ? (m.q6!==undefined ? m.q6 : Math.round(m.q*1.5*100)/100) : m.q; }
  function fq(n,u){ return (Math.round(n*100)/100)+(u||''); }
  const all=()=>BOOK.concat(GENF,S.custom);
  function ev(r){
    let have=0, lack=[], resc=[];
    r.main.forEach(m=>{ const s=stock(m.n);
      if(s){ have++; const d=dl(s); if(d!==null&&d<=3) resc.push(s.name); } else lack.push(m.n); });
    const pct=Math.round(have/r.main.length*100);
    return { pct, lack, resc, score: pct + resc.length*25 + (r.gen?0:4) };
  }

  /* ================= 描画 ================= */

      '<div class="row"><input type="text" id="f-name" placeholder="食材名" style="flex:2"><input type="number" id="f-qty" value="1" step="0.5" style="flex:1"><input type="text" id="f-unit" placeholder="個" style="flex:1"></div>'+

  function cook(){
    const ranked=all().map(r=>({r,e:ev(r)}))
      .filter(x=> filter==='all' ? true : filter==='book' ? !x.r.gen : x.r.base===filter)
      .sort((a,b)=>b.e.score-a.e.score);
    const cut = showAll ? ranked.slice(0,150) : ranked.slice(0,14);
    const body = !S.inv.length
      ? '<div class="empty">冷蔵庫に食材を入れると、作れる順に並びます。</div>'
      : cut.map(x=>card(x.r,x.e)).join('') +
        (ranked.length>cut.length ? '<button class="ghost" id="more" style="width:100%">残り'+(ranked.length-cut.length)+'件を表示</button>' : '');

    const chips='<div class="chips"><span class="chip '+(filter==='all'?'sel':'')+'" data-f="all">すべて</span>'+
      '<span class="chip '+(filter==='book'?'sel':'')+'" data-f="book">メニュー集どおり</span>'+
      BASES.map(b=>'<span class="chip '+(filter===b.id?'sel':'')+'" data-f="'+b.id+'">'+b.short+'</span>').join('')+'</div>';

    return '<section id="s-cook" class="'+(tab==='cook'?'on':'')+'">'+
      '<div class="card"><h2>何人分で作る</h2>'+

      '<div class="card"><h2>押すボタンで絞る</h2>'+chips+
      '<div class="sub" style="margin:0">「メニュー集どおり」以外は、同じボタンで作れる応用です。全'+(GENF.length+BOOK.length)+'品。</div></div>'+
      body+customForm()+'</section>';

  function card(r,e){
    const open=(openRec===r.id), inPlan=(S.plan.indexOf(r.id)>=0);
    let h='<div class="rec-hd" data-open="'+r.id+'"><div class="rec-line"><span class="rec-name">'+esc(r.name)+'</span>'+
      '<span class="rec-pct">'+e.pct+'%</span></div>'+

    if(e.resc.length) h+='<div class="rec-rescue">期限が近い '+esc(e.resc.join('・'))+' を使い切れます</div>';

    h+='</div>';
    if(!open) return '<div class="rec'+(inPlan?' pin':'')+'">'+h+'</div>';

    const ings=r.main.map(m=>{ const s=stock(m.n);
      return '<div class="ing '+(s?'':'no')+'"><span>'+esc(m.n)+(m.c?'<br><span style="font-size:11px;color:var(--mute)">'+esc(m.c)+'</span>':'')+'</span>'+
      '<span style="white-space:nowrap">'+esc(fq(q(m),m.u))+' '+(s?'✓':'× 買う')+'</span></div>'; }).join('');

      '<button class="go" id="x-add">保存する</button></div>';

  function need(){
    const acc={};
    S.plan.forEach(id=>{ const r=all().find(x=>x.id===id); if(!r) return;
      r.main.forEach(m=>{ const c=canon(m.n); if(!acc[c]) acc[c]={name:m.n,q:0,u:m.u}; acc[c].q+=q(m); }); });
    const out=[];
    for(const c in acc){ const n=acc[c], s=stock(n.name); let short=n.q, note='', vague=false;
      if(s){ if(s.unit===n.u){ short=n.q-s.qty; note='在庫 '+fq(s.qty,s.unit); }
             else { short=0; vague=true; note='在庫 '+fq(s.qty,s.unit)+'（量は要確認）'; } }
      if(short>0.001||vague) out.push({key:c,name:n.name,q:Math.round(short*100)/100,u:n.u,note,aisle:aisle(n.name),vague}); }
    return out;
  }

  function shop(){
    const items=need();
    const plan=S.plan.length ? S.plan.map(id=>{ const r=all().find(x=>x.id===id);
      return r?'<div class="plan-i"><span style="flex:1">'+esc(r.name)+'</span><span style="font-size:11px;color:var(--mute)">'+esc(r.min)+'</span><button data-unplan="'+id+'">×</button></div>':''; }).join('')
      : '<div class="empty">献立タブで「今週の献立に入れる」を押すと並びます。</div>';

    let list;
    if(!S.plan.length) list='<div class="empty">献立が決まると買い物リストができます。</div>';
    else if(!items.length) list='<div class="empty">追加で買うものはありません。</div>';
    else { const g={}; items.forEach(i=>{ (g[i.aisle]=g[i.aisle]||[]).push(i); });
      list=Object.keys(g).map(a=>'<div class="shop-g"><h3>'+esc(a)+'</h3>'+g[a].map(i=>
        '<label class="shop-i '+(S.chk[i.key]?'done':'')+'"><input type="checkbox" data-chk="'+i.key+'"'+(S.chk[i.key]?' checked':'')+'>'+
        '<span>'+esc(i.name)+(i.note?'<br><span style="font-size:11px;color:var(--mute)">'+esc(i.note)+'</span>':'')+'</span>'+
        '<span class="q">'+(i.vague?'量を確認':esc(fq(i.q,i.u)))+'</span></label>').join('')+'</div>').join('')+
        '<button class="go" id="p-stock" style="margin-top:6px">チェックした分を冷蔵庫に入れる</button>'; }

    const ms=new Date(); ms.setDate(1); ms.setHours(0,0,0,0);
    const ml=(S.loss||[]).filter(x=>new Date(x.d+'T00:00:00')>=ms);
    const last4=(S.spend||[]).slice(-4), tot=last4.reduce((a,b)=>a+b.v,0);

    return '<section id="s-shop" class="'+(tab==='shop'?'on':'')+'">'+
      '<div class="card"><h2>今週の献立<span class="n">'+S.plan.length+'品</span></h2>'+plan+'</div>'+
      '<div class="card"><h2>買い足すものだけ</h2><div class="sub">必要量から在庫を引いています。</div>'+list+'</div>'+
      '<div class="card"><h2>今月の結果</h2>'+
      (ml.length?'<div class="loss">捨てた食材：'+ml.length+'品（'+esc(ml.slice(-4).map(x=>x.n).join('、'))+(ml.length>4?' ほか':'')+'）</div>'
                :'<div class="sub" style="margin:0">今月まだ捨てた食材はありません。</div>')+
      '<div style="height:10px"></div>'+
      '<div class="money"><input type="number" id="m-val" placeholder="今日の買い物額（円）"><button class="ghost" id="m-add">記録</button></div>'+
      (last4.length?'<div style="font-size:12px;color:var(--ink2);margin-top:8px">直近'+last4.length+'回：'+last4.map(x=>x.v.toLocaleString()+'円').join(' / ')+'　合計 '+tot.toLocaleString()+'円</div>':'')+
      '</div>'+
      '<div class="card"><h2>データの引っ越し</h2>'+
      '<div class="sub">保存先：'+esc(WHERE)+'。別の開きかたに移すときは、書き出したテキストを貼り付けてください。</div>'+
      '<textarea id="io" rows="3" placeholder="ここに貼り付けて「読み込む」"></textarea>'+
      '<div style="height:8px"></div>'+
      '<div class="row" style="margin:0"><button class="ghost" id="io-out" style="flex:1">書き出す</button>'+
      '<button class="ghost" id="io-in" style="flex:1">読み込む</button></div></div>'+
      '</section>';
  }

  function navbar(n){
    const b=(k,l,g)=>'<button class="'+(tab===k?'on':'')+'" data-tab="'+k+'">'+l+(g?'<span class="badge">'+g+'</span>':'')+'</button>';
    return '<nav>'+b('fridge','冷蔵庫',n)+b('cook','献立')+b('shop','買い物'+(S.plan.length?'（'+S.plan.length+'）':''))+'</nav>';
  }

  /* ================= 操作 ================= */
  function addItem(name,qty,unit,loc,exp){
    S.inv.push({ id:'i'+Date.now()+Math.random().toString(36).slice(2,5), name, qty, unit, loc, exp });
  }
  function defExp(name){ const d=new Date(); d.setDate(d.getDate()+(SHELF[aisle(name)]||7)); return d.toISOString().slice(0,10); }

  function bind(){
    const a=document.getElementById('app');
    a.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; render(); window.scrollTo(0,0); });
    a.querySelectorAll('[data-quick]').forEach(c=>c.onclick=()=>{ a.querySelector('#f-name').value=c.dataset.quick; });
    a.querySelectorAll('[data-f]').forEach(c=>c.onclick=()=>{ filter=c.dataset.f; showAll=false; openRec=null; render(); });
    a.querySelectorAll('[data-serv]').forEach(c=>c.onclick=()=>{ S.serv=Number(c.dataset.serv); save(); render(); });
    const more=a.querySelector('#more'); if(more) more.onclick=()=>{ showAll=true; render(); };

    a.querySelectorAll('[data-exp]').forEach(c=>c.onclick=()=>{ const v=c.dataset.exp, f=a.querySelector('#f-exp');
      if(v===''){ f.value=''; return; }
      const d=new Date(); d.setDate(d.getDate()+Number(v)); f.value=d.toISOString().slice(0,10);
      a.querySelectorAll('[data-exp]').forEach(o=>o.classList.remove('sel')); c.classList.add('sel'); });

    const ba=a.querySelector('#b-add');
    if(ba) ba.onclick=()=>{ const raw=a.querySelector('#b-text').value.trim();
      if(!raw){ toast('入れるものを書いてください'); return; }
      let c=0;
      raw.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
        const m=l.match(/^(.+?)[\s　]+([0-9.]+)(.*)$/);
        const name=m?m[1]:l, qty=m?Number(m[2]):1, unit=m?((m[3]||'').trim()||'個'):'個';
        addItem(name,qty,unit,'冷蔵',defExp(name)); c++; });
      save(); render(); toast(c+'品を入れました'); };

    const fa=a.querySelector('#f-add');
    if(fa) fa.onclick=()=>{ const n=a.querySelector('#f-name').value.trim();
      if(!n){ toast('食材名を入れてください'); return; }
      addItem(n, Number(a.querySelector('#f-qty').value)||1, a.querySelector('#f-unit').value.trim()||'個',
        a.querySelector('#f-loc').value, a.querySelector('#f-exp').value||null);
      save(); render(); toast(n+' を入れました'); };

    a.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ S.inv=S.inv.filter(i=>i.id!==b.dataset.del); save(); render(); });
    a.querySelectorAll('[data-toss]').forEach(b=>b.onclick=()=>{
      const it=S.inv.find(i=>i.id===b.dataset.toss); if(!it) return;
      S.loss=(S.loss||[]).concat([{d:new Date().toISOString().slice(0,10),n:it.name}]);
      S.inv=S.inv.filter(i=>i.id!==it.id); save(); render(); toast('記録しました'); });

    a.querySelectorAll('[data-open]').forEach(h=>h.onclick=()=>{ openRec=(openRec===h.dataset.open?null:h.dataset.open); render(); });
    a.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{ const id=b.dataset.plan, i=S.plan.indexOf(id);
      if(i>=0) S.plan.splice(i,1); else S.plan.push(id); save(); render(); });
    a.querySelectorAll('[data-unplan]').forEach(b=>b.onclick=()=>{ S.plan=S.plan.filter(x=>x!==b.dataset.unplan); save(); render(); });

    a.querySelectorAll('[data-made]').forEach(b=>b.onclick=()=>{ const r=all().find(x=>x.id===b.dataset.made); if(!r) return;
      const used=[];
      r.main.forEach(m=>{ const s=stock(m.n); if(!s) return; used.push(s.name);
        if(s.unit===m.u){ s.qty=Math.round((s.qty-q(m))*100)/100; if(s.qty<=0.001) S.inv=S.inv.filter(x=>x.id!==s.id); }
        else S.inv=S.inv.filter(x=>x.id!==s.id); });
      S.plan=S.plan.filter(x=>x!==r.id); save(); render();
      toast(used.length?used.join('・')+' を減らしました':'在庫に該当なし'); });

    a.querySelectorAll('[data-memo]').forEach(inp=>inp.onchange=()=>{ S.memo[inp.dataset.memo]=inp.value.trim(); save(); });
    a.querySelectorAll('[data-chk]').forEach(c=>c.onchange=()=>{ S.chk[c.dataset.chk]=c.checked; save(); render(); });

    const ps=a.querySelector('#p-stock');
    if(ps) ps.onclick=()=>{ const its=need().filter(i=>S.chk[i.key]);
      if(!its.length){ toast('チェックがありません'); return; }
      its.forEach(i=>{ const s=stock(i.name);
        if(s&&s.unit===i.u){ s.qty+=i.q; s.exp=defExp(i.name); }
        else addItem(i.name,i.q||1,i.u,'冷蔵',defExp(i.name));
        delete S.chk[i.key]; });
      save(); render(); toast(its.length+'品を冷蔵庫に入れました'); };

    const xa=a.querySelector('#x-add');
    if(xa) xa.onclick=()=>{ const n=a.querySelector('#x-name').value.trim(), raw=a.querySelector('#x-ing').value.trim();
      if(!n||!raw){ toast('料理名と材料を入れてください'); return; }
      const bid=a.querySelector('#x-base').value, b=BASES.find(x=>x.id===bid);
      const main=raw.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
        const m=l.match(/^(.+?)[\s　]+([0-9.]+)(.*)$/);
        return m?{n:m[1],q:Number(m[2]),u:(m[3]||'').trim()}:{n:l,q:1,u:''}; });
      S.custom.push({ id:'c'+Date.now(), name:n, base:bid, baseLabel:b.label, gen:false,
        nav:'メニューを選ぶ → カテゴリーで探す → '+b.nav, icons:b.icons, min:b.min,
        main, sub4:[], steps:[b.order], src:'わが家のレシピ' });
      save(); render(); toast(n+' を保存しました'); };

    const o1=a.querySelector('#io-out');
    if(o1) o1.onclick=()=>{ const t=a.querySelector('#io'); t.value=JSON.stringify(S); t.select(); toast('コピーして保管してください'); };
    const o2=a.querySelector('#io-in');
    if(o2) o2.onclick=()=>{ const t=a.querySelector('#io').value.trim();
      if(!t){ toast('貼り付けてください'); return; }
      try{ S=Object.assign(S,JSON.parse(t)); save(); render(); toast('読み込みました'); }
      catch(e){ toast('読み込めませんでした'); } };

    const ma=a.querySelector('#m-add');
    if(ma) ma.onclick=()=>{ const v=Number(a.querySelector('#m-val').value);
      if(!v){ toast('金額を入れてください'); return; }
      S.spend=(S.spend||[]).concat([{d:new Date().toISOString().slice(0,10),v}]); save(); render(); toast('記録しました'); };
  }

  load().then(render);
})();
</script>
